name: weekly price snapshot

on:
  schedule:
    # Saturday 19:17 UTC = 21:17 Zagreb (CEST) / 20:17 (CET). Day's archive is long published by then.
    - cron: "17 19 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build snapshot
        env:
          HOME_LAT: ${{ secrets.HOME_LAT }}
          HOME_LON: ${{ secrets.HOME_LON }}
        run: |
          set -o pipefail
          python scripts/filter.py 2>&1 | tee build.log
      - name: Commit data
        if: always()
        run: |
          mv build.log data/build.log
          git config user.name "jelovnik-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "snapshot $(date -u +%F)" || echo "nothing to commit"
          git push
